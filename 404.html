<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // 定义短链接字典 (键为短路径，值为目标长链接)
      var redirects = {
        "/dl": "/docs/get-started/download",
        "/faq": "/docs/FAQ/data-and-feedback",
        "/apple": "/docs/features/lyrics-cfg/apple-music",
      };

      var path = window.location.pathname.toLowerCase();
      if (path.endsWith('/') && path.length > 1) {
        path = path.slice(0, -1); // 移除末尾斜杠
      }

      // 如果匹配到短链接，跳转到指定目标
      if (redirects[path]) {
        window.location.replace(redirects[path]);
      } else {
        // 否则回退到默认逻辑 (保留原本的 hash)
        window.location.replace('/' + window.location.hash);
      }
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        color: #333;
        background: #fafafa;
      }
      p { margin: 8px 0; }
      a { color: #7b8898; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <p>Returning to homepage... If not redirected automatically, <a href="/">click here</a>.</p>
    <p>正在返回主页... 如果没有自动跳转，<a href="/">请点击这里</a>。</p>
  </body>
</html>
