<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- 立即重定向到主页 -->
    <meta http-equiv="refresh" content="0; url=/" />
    <script>
      // 优先使用 JavaScript 重定向，这样可以保留原本的 hash (例如 #docs/xxx)
      window.location.replace('/' + window.location.hash);
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        color: #333;
        background: #fafafa;
      }
      p { margin: 8px 0; }
      a { color: #7b8898; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <p>Returning to homepage... If not redirected automatically, <a href="/">click here</a>.</p>
    <p>正在返回主页... 如果没有自动跳转，<a href="/">请点击这里</a>。</p>
  </body>
</html>
