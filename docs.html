<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="pageTitle">BetterLyrics Documentation</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lora:wght@500;600&family=Noto+Sans+SC:wght@300;400;600&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div class="custom-cursor-dot"></div>
    <div class="custom-cursor-ring"></div>
    <div class="background-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
    </div>

    <nav class="navbar">
      <a href="index.html" class="logo-container" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;">
        <img src="public/favicon.ico" alt="Logo" class="app-logo" style="height: 28px; width: auto;" />
        <div class="logo" data-i18n="logoText">BetterLyrics</div>
        <div class="slogan" data-i18n="heroSubtitle">Strums the Heartstrings, Graces the Wordscapes.</div>
      </a>
      <div class="controls">
        <div class="search-container">
          <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="Search docs..." autocomplete="off" />
          <i class="ph ph-magnifying-glass search-icon"></i>
          <div id="search-results" class="search-results"></div>
        </div>
        <div class="custom-lang-switch" id="lang-switch-container">
          <button class="lang-toggle" id="lang-toggle">
            <span id="current-lang">English</span>
            <svg viewBox="0 0 24 24" class="chevron">
              <path
                d="M6 9l6 6 6-6"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <ul class="lang-menu" id="lang-menu">
            <li data-value="en" class="active">English</li>
            <li data-value="zh">中文</li>
          </ul>
        </div>
        <button id="theme-switch" aria-label="Toggle Theme">
          <i class="ph ph-sun sun-icon" style="font-size: 24px"></i>
          <i class="ph ph-moon moon-icon" style="font-size: 24px"></i>
        </button>
      </div>
    </nav>

    <div class="docs-container">
      <aside class="sidebar reveal">
        <nav id="sidebar-nav">
          <!-- Sidebar generated by JS -->
        </nav>
      </aside>
      
      <main class="content-area reveal">
        <div id="markdown-content">
          <!-- Markdown injected here -->
        </div>
      </main>
    </div>

    <footer>
      <p>© 2026 BetterLyrics</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
